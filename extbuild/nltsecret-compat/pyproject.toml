[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nltsecret"
version = "1.4.84"
description = "Compatibility package for funsecret"
requires-python = ">=3.8"
license = "MIT"
dependencies = ["funsecret>=1.4.84"]

[project.scripts]
nltsecret = "funsecret.cli:app"
