[build-system]
requires = [ "setuptools>=77",]
build-backend = "setuptools.build_meta"

[project]
name = "funsecret"
version = "1.4.93"
description = "funsecret"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [ "cryptography>=43.0.3", "diskcache>=5.6.3,<6", "farcache>=2.0.3", "farlog>=1.1.4", "sqlalchemy>=2.0.35", "tqdm>=4.67.0", "typer>=0.12.5",]
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"
[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"
[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funsecret"
Releases = "https://github.com/farfarfun/funsecret/releases"

[project.scripts]
funsecret = "funsecret.cli:app"

[project.optional-dependencies]
mysql = [ "pymysql>=1.1.1",]
mysqlclient = [ "mysqlclient>=2.2.7",]

[tool.uv.workspace]
members = [ "extbuild/funsecret-snapshot",]
