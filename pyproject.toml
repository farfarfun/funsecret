[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "funsecret"
version = "2.1.1"
description = "Local-first encrypted secret manager with SQLite and database sync"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["secret", "fernet", "sqlite", "encryption", "credentials"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
]
# 零运行时依赖：核心存储、加解密与数据库同步全部在 Rust 扩展内完成。
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

# 对齐 funget：PyPI 包只提供 Python API，不再安装 funsecret 命令行入口。
# 命令行统一通过 apt / brew / cargo install / GitHub Release 静态二进制分发，避免与系统 PATH 冲突。

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funsecret"
Releases = "https://github.com/farfarfun/funsecret/releases"

[tool.maturin]
features = ["pyo3/abi3-py312"]
module-name = "funsecret._funsecret"
python-source = "src"
manifest-path = "crates/funsecret-py/Cargo.toml"
strip = true

[tool.uv.workspace]
members = ["extbuild/funsecret-snapshot"]
